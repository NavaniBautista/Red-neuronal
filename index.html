<canvas id="screen"></canvas>
<script>
'use strict';
/* =====================================================================
   NEURAL NET — a real 784-16-16-10 MLP learning procedural digits, drawn as
   vector graphics at the display's native resolution (4K on a 4K screen).
   Vanilla JS + Canvas 2D + WebAudio only.
   Simulation (dataset, network, state machine, particles) is independent
   of rendering: everything runs headless via selfTest() or ?test.
   ===================================================================== */

// ---------------------------------------------------------------- constants
const LW = 256, LH = 144;
const DT = 1000 / 60;
const N0 = 784, N1 = 16, N2 = 16, N3 = 10;
const NTRAIN = 3000, NTEST = 500, NVAL = 500;   // train / test / validation (three-way holdout)
const BATCH = 32, LR = 0.0004, MOM = 0.9;   // η deliberately low so ≥93% takes ~70 s of animation (with the usual
                                            // η ≈ 0.01 this net gets there in ~150 steps, under one cycle)
const DATA_SEED = 0x5eed1e55, NET_SEED0 = 7;
const ST_IDLE = 0, ST_INPUT = 1, ST_FORWARD = 2, ST_SOFTMAX = 3, ST_LOSS = 4,
      ST_BACKWARD = 5, ST_UPDATE = 6, ST_TRAIN = 7, ST_SOLVED = 8;
const DUR = [25, 25, 110, 30, 35, 110, 45, 65, 240];
const CYCLE_FRAMES = 445;
const TRAIN_STEPS_PER_FRAME = 3;
const TRAVEL = 18;            // frames a forward pulse needs to cross one layer gap
const TRAVEL_B = 15;          // backward pulses are faster
const TL_LOSS = 10;           // true-label bar → loss node (LOSS) and loss node → each output (BACKWARD)
const BT0 = 13, BSP = 23;     // backward layer windows start at BT0 + (2 − L)·BSP, plus a 0..7 frame stagger
const TW = 8, PAINT_D = 18;   // input neuron → pixel wire pulses; sweep that paints ∂L/∂x on the image
const K_TOP = 5;              // drawn incoming edges per destination neuron
const NWL = 6;                // line-width levels of the dormant mesh (thickness ∝ |w|)
const PCAP = 384;             // particle pool capacity
const MAX_STEPS = 8000;
const PI = Math.PI;
// events the simulation emits for the (optional) audio layer; ring buffer of 256
const EV_STATE = 1, EV_WRITE = 2, EV_LAUNCH = 3, EV_ARRIVE = 4, EV_IGNF = 5, EV_IGNB = 6, EV_PRED = 7, EV_GLITCH = 8,
      EV_LOSS = 9, EV_UPDATE = 10, EV_TICK = 11, EV_EVAL = 12, EV_SCAN = 13, EV_PARADE = 14, EV_RESET = 15,
      EV_PAINT = 16, EV_WIRE = 17;

const nowMs = (typeof performance !== 'undefined' && performance.now)
  ? function () { return performance.now(); } : function () { return Date.now(); };

// ---------------------------------------------------------------- palette (25 colors)
const PAL_HEX = [
  '#000000', // 0  black
  '#080c18', // 1  dot texture (darkest navy)
  '#101831', // 2  dormant connection
  '#22325f', // 3  neuron ring
  '#0c1f5c', // 4  F0 deep navy
  '#1440b8', // 5  F1 royal blue
  '#2a6cff', // 6  F2 electric blue
  '#45b4ff', // 7  F3 bright cyan-blue
  '#b4ecff', // 8  F4 pale cyan
  '#ffffff', // 9  white
  '#3a0b22', // 10 B0 dark wine
  '#8c0f3c', // 11 B1 crimson
  '#e01a5e', // 12 B2 hot red-magenta
  '#ff40b4', // 13 B3 bright magenta
  '#ffb8e0', // 14 B4 pale pink
  '#333333', // 15 G1
  '#6e6e6e', // 16 G2
  '#b0b0b0', // 17 G3
  '#9aa4b8', // 18 label gray
  '#6a7388', // 19 frame gray
  '#454d61', // 20 HUD gray
  '#0a1538', // 21 dot wave (blue)
  '#1e0818', // 22 dot wave (magenta)
  '#18264e', // 23 strong dormant connection / bar track
  '#2c3f78'  // 24 ring (breathing)
];
const FR = new Uint8Array([4, 5, 6, 7, 8, 9]);        // forward ramp
const BR = new Uint8Array([10, 11, 12, 13, 14, 9]);   // backward ramp
const BRK = new Uint8Array([9, 14, 13, 12, 11]);      // loss flash white -> magenta

// ---------------------------------------------------------------- PRNG (mulberry32)
function Rng(seed) { this.s = seed >>> 0; }
Rng.prototype.next = function () {
  let t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
Rng.prototype.range = function (a, b) { return a + (b - a) * this.next(); };
Rng.prototype.int = function (n) { return (this.next() * n) | 0; };
Rng.prototype.gauss = function () {
  let u = 0; while (u <= 1e-12) u = this.next();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * PI * this.next());
};

// ---------------------------------------------------------------- procedural digits
function arc(cx, cy, rx, ry, a0, a1, n) {
  const p = [];
  for (let i = 0; i <= n; i++) { const t = a0 + (a1 - a0) * i / n; p.push(cx + rx * Math.cos(t), cy + ry * Math.sin(t)); }
  return p;
}
function cat() { let r = []; for (let i = 0; i < arguments.length; i++) r = r.concat(arguments[i]); return r; }
// Each digit: list of variants; variant: list of strokes; stroke: flat [x,y,...] in a unit box.
const GLYPHS = [
  [[arc(.5, .5, .26, .4, -PI / 2, 1.5 * PI + .2, 30)], [arc(.5, .5, .3, .38, -PI * .65, 1.35 * PI + .25, 30)]],
  [[[.52, .1, .48, .9]], [[.33, .27, .53, .1, .5, .9]], [[.33, .27, .53, .1, .5, .9], [.34, .9, .68, .9]]],
  [[cat(arc(.5, .32, .25, .22, -PI * .95, PI * .22, 16), [.24, .9, .8, .9])],
   [cat(arc(.5, .3, .26, .2, -PI, PI * .2, 16), [.22, .88]), [.22, .88, .82, .86]]],
  [[cat(arc(.48, .3, .23, .2, -PI * .85, PI * .5, 14), arc(.48, .69, .27, .21, -PI * .5, PI * .85, 14))],
   [cat([.25, .1, .75, .1, .45, .44], arc(.48, .67, .27, .23, -PI * .6, PI * .85, 14))]],
  [[[.64, .92, .64, .1, .18, .64, .84, .64]], [[.3, .1, .24, .6, .82, .6], [.66, .3, .66, .92]]],
  [[cat([.76, .1, .33, .1, .29, .46], arc(.47, .66, .27, .24, -PI * .75, PI * .8, 16))],
   [cat([.33, .1, .29, .46], arc(.47, .66, .27, .24, -PI * .75, PI * .8, 16)), [.33, .1, .76, .1]]],
  [[cat([.7, .1, .48, .22, .33, .42], arc(.5, .68, .21, .22, PI + .4, 3 * PI + .4, 24))],
   [cat([.66, .08, .4, .3], arc(.5, .66, .23, .24, PI + .6, 3 * PI + .5, 24))]],
  [[[.2, .1, .8, .1, .42, .9]], [[.2, .1, .8, .1, .42, .9], [.33, .5, .72, .5]], [[.2, .22, .2, .1, .8, .1, .42, .9]]],
  [[arc(.5, .29, .2, .19, -PI / 2, 1.5 * PI, 22), arc(.5, .69, .25, .21, -PI / 2, 1.5 * PI, 24)],
   [cat(arc(.5, .3, .21, .2, PI / 2, -1.5 * PI, 22), arc(.5, .7, .24, .2, -PI / 2, 1.5 * PI, 24))]],
  [[arc(.5, .32, .23, .21, 0, 2 * PI + .15, 24), [.73, .32, .66, .9]],
   [cat(arc(.5, .3, .22, .2, PI * .1, 2 * PI + .1, 24), [.72, .36, .7, .62, .6, .9])]]
];

const CV = 40;                                   // oversized raster, cropped by center of mass
const TMPV = new Float32Array(CV * CV), TMPO = new Uint8Array(CV * CV);
const SPX = new Float32Array(1024), SPY = new Float32Array(1024), SSTART = new Int32Array(8);
const SLEN = new Float32Array(8), STRIM0 = new Float32Array(8), STRIM1 = new Float32Array(8);
const WARP = 0.07, TRIM = 0.14, GLYPH_PX = 23;   // elastic wobble amplitude, max fraction of a stroke left undrawn

function stamp(cx, cy, r, ord) {
  const x0 = Math.max(0, Math.floor(cx - r - 1)), x1 = Math.min(CV - 1, Math.ceil(cx + r + 1));
  const y0 = Math.max(0, Math.floor(cy - r - 1)), y1 = Math.min(CV - 1, Math.ceil(cy + r + 1));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
    let v = r + 0.5 - Math.sqrt(dx * dx + dy * dy);
    if (v <= 0) continue; if (v > 1) v = 1;
    const i = y * CV + x;
    if (v > TMPV[i]) TMPV[i] = v;
    if (v > 0.1 && TMPO[i] === 255) TMPO[i] = ord;
  }
}

// X: pixel values 0..1, O: stroke order 0..254 (255 = faint / never) used for the "writing" reveal.
function genSample(rng, d, X, O, base) {
  const vars = GLYPHS[d], strokes = vars[rng.int(vars.length)];
  const rot = rng.range(-12, 12) * PI / 180, sc = rng.range(0.8, 1.1), sh = rng.range(-0.3, 0.3);
  const asp = rng.range(0.85, 1.15), tx = rng.range(-2, 2), ty = rng.range(-2, 2);
  const r = rng.range(1.5, 3) / 2;
  const w1 = rng.range(-WARP, WARP), f1 = rng.range(0.5, 1.5) * 2 * PI, p1 = rng.range(0, 2 * PI);
  const w2 = rng.range(-WARP, WARP), f2 = rng.range(0.5, 1.5) * 2 * PI, p2 = rng.range(0, 2 * PI);
  const cs = Math.cos(rot), sn = Math.sin(rot);
  TMPV.fill(0); TMPO.fill(255);
  let np = 0, total = 0;
  for (let si = 0; si < strokes.length; si++) {
    const s = strokes[si], n = s.length >> 1, ctrl = n <= 8;
    const ox = rng.range(-0.02, 0.02), oy = rng.range(-0.02, 0.02);
    SSTART[si] = np; SLEN[si] = 0;
    STRIM0[si] = rng.range(0, TRIM); STRIM1[si] = 1 - rng.range(0, TRIM);   // pen lifts early / starts late
    for (let k = 0; k < n; k++) {
      let u = s[2 * k] + ox, v = s[2 * k + 1] + oy;
      if (ctrl) { u += rng.range(-0.03, 0.03); v += rng.range(-0.03, 0.03); }   // control-point jitter
      const uu = u + w1 * Math.sin(f1 * v + p1), vv = v + w2 * Math.sin(f2 * u + p2);
      let x = (uu - 0.5) * GLYPH_PX * asp; const y = (vv - 0.5) * GLYPH_PX;
      x -= sh * y;                                                              // slant
      SPX[np] = 20 + sc * (x * cs - y * sn) + tx;
      SPY[np] = 20 + sc * (x * sn + y * cs) + ty;
      if (k > 0) { const l = Math.hypot(SPX[np] - SPX[np - 1], SPY[np] - SPY[np - 1]); total += l; SLEN[si] += l; }
      np++;
    }
  }
  SSTART[strokes.length] = np;
  let acc = 0;
  for (let si = 0; si < strokes.length; si++) {
    let sacc = 0;
    const lo = STRIM0[si] * SLEN[si], hi = STRIM1[si] * SLEN[si];
    for (let k = SSTART[si]; k < SSTART[si + 1] - 1; k++) {
      const x0 = SPX[k], y0 = SPY[k], x1 = SPX[k + 1], y1 = SPY[k + 1];
      const L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / 0.3));
      for (let q = 0; q <= n; q++) {
        const f = q / n, sp = sacc + L * f;
        if (sp < lo || sp > hi) continue;
        stamp(x0 + (x1 - x0) * f, y0 + (y1 - y0) * f, r, Math.min(254, ((acc + L * f) / total * 254) | 0));
      }
      acc += L; sacc += L;
    }
  }
  // center of mass -> (14,14), like MNIST
  let sw = 0, sx = 0, sy = 0;
  for (let y = 0; y < CV; y++) for (let x = 0; x < CV; x++) {
    const v = TMPV[y * CV + x]; sw += v; sx += (x + 0.5) * v; sy += (y + 0.5) * v;
  }
  const c0 = Math.round(sx / sw - 14), r0 = Math.round(sy / sw - 14);
  for (let rr = 0; rr < 28; rr++) for (let cc = 0; cc < 28; cc++) {
    const xs = cc + c0, ys = rr + r0, idx = base + rr * 28 + cc;
    if (xs >= 0 && xs < CV && ys >= 0 && ys < CV) { X[idx] = TMPV[ys * CV + xs]; O[idx] = TMPO[ys * CV + xs]; }
    else { X[idx] = 0; O[idx] = 255; }
  }
}

const trainX = new Float32Array(NTRAIN * N0), trainY = new Uint8Array(NTRAIN), trainO = new Uint8Array(NTRAIN * N0);
const testX = new Float32Array(NTEST * N0), testY = new Uint8Array(NTEST), testO = new Uint8Array(NTEST * N0);
// validation digits: never trained on; they decide when the run counts as SOLVED, so the test set stays untouched
// until the final model is evaluated once (generated after the test set, so train/test are unchanged)
const valX = new Float32Array(NVAL * N0), valY = new Uint8Array(NVAL), valO = new Uint8Array(NVAL * N0);
(function buildDataset() {
  const rng = new Rng(DATA_SEED);
  for (let i = 0; i < NTRAIN; i++) { const d = i % 10; trainY[i] = d; genSample(rng, d, trainX, trainO, i * N0); }
  for (let i = 0; i < NTEST; i++) { const d = i % 10; testY[i] = d; genSample(rng, d, testX, testO, i * N0); }
  for (let i = 0; i < NVAL; i++) { const d = i % 10; valY[i] = d; genSample(rng, d, valX, valO, i * N0); }
})();

// ---------------------------------------------------------------- network 784-16-16-10
// Weight layout is input-major: W[i*Nout + j] connects input i -> output j.
function Net() {
  this.W1 = new Float32Array(N0 * N1); this.b1 = new Float32Array(N1);
  this.W2 = new Float32Array(N1 * N2); this.b2 = new Float32Array(N2);
  this.W3 = new Float32Array(N2 * N3); this.b3 = new Float32Array(N3);
  this.vW1 = new Float32Array(N0 * N1); this.vb1 = new Float32Array(N1);
  this.vW2 = new Float32Array(N1 * N2); this.vb2 = new Float32Array(N2);
  this.vW3 = new Float32Array(N2 * N3); this.vb3 = new Float32Array(N3);
  this.gW1 = new Float32Array(N0 * N1); this.gb1 = new Float32Array(N1);
  this.gW2 = new Float32Array(N1 * N2); this.gb2 = new Float32Array(N2);
  this.gW3 = new Float32Array(N2 * N3); this.gb3 = new Float32Array(N3);
  this.z1 = new Float32Array(N1); this.a1 = new Float32Array(N1);
  this.z2 = new Float32Array(N2); this.a2 = new Float32Array(N2);
  this.z3 = new Float32Array(N3); this.p = new Float32Array(N3); this.lse = 0;   // lse = log Σ_k exp z_k
  this.d1 = new Float32Array(N1); this.d2 = new Float32Array(N2); this.d3 = new Float32Array(N3);
  this.perm = new Int32Array(NTRAIN);
  this.rng = new Rng(1);
  this.ptr = 0; this.epoch = 1; this.steps = 0; this.trainLoss = Math.log(10); this.emaRaw = 0; this.emaN = 0;
  this.lastAcc = 0; this.lastLoss = Math.log(10);   // result of the last evaluate() (validation or test set)
}
Net.prototype.reset = function (seed) {
  const r = this.rng; r.s = seed >>> 0;
  let sd = Math.sqrt(2 / N0); for (let i = 0; i < this.W1.length; i++) this.W1[i] = r.gauss() * sd;
  sd = Math.sqrt(2 / N1); for (let i = 0; i < this.W2.length; i++) this.W2[i] = r.gauss() * sd;
  sd = Math.sqrt(2 / N2); for (let i = 0; i < this.W3.length; i++) this.W3[i] = r.gauss() * sd;
  this.b1.fill(0); this.b2.fill(0); this.b3.fill(0);
  this.vW1.fill(0); this.vb1.fill(0); this.vW2.fill(0); this.vb2.fill(0); this.vW3.fill(0); this.vb3.fill(0);
  for (let i = 0; i < NTRAIN; i++) this.perm[i] = i;
  this.shuffle(); this.ptr = 0; this.epoch = 1; this.steps = 0; this.emaRaw = 0; this.emaN = 0;
  let l0 = 0;   // before the first step the shown training loss is that of the initial weights on the first mini-batch
  for (let b = 0; b < BATCH; b++) { const s = this.perm[b]; this.forward(trainX, s * N0); l0 += this.nll(trainY[s]); }
  this.trainLoss = l0 / BATCH;
};
Net.prototype.shuffle = function () {
  const p = this.perm;
  for (let i = p.length - 1; i > 0; i--) { const j = this.rng.int(i + 1); const t = p[i]; p[i] = p[j]; p[j] = t; }
};
Net.prototype.ensureBatch = function () {
  if (this.ptr + BATCH > NTRAIN) { this.shuffle(); this.ptr = 0; this.epoch++; }
};
Net.prototype.forward = function (X, off) {
  const W1 = this.W1, W2 = this.W2, W3 = this.W3, z1 = this.z1, a1 = this.a1, z2 = this.z2, a2 = this.a2, z3 = this.z3, p = this.p;
  for (let j = 0; j < N1; j++) z1[j] = this.b1[j];
  for (let i = 0; i < N0; i++) {
    const x = X[off + i]; if (x === 0) continue;
    const r = i * N1; for (let j = 0; j < N1; j++) z1[j] += W1[r + j] * x;
  }
  for (let j = 0; j < N1; j++) a1[j] = z1[j] > 0 ? z1[j] : 0;
  for (let j = 0; j < N2; j++) z2[j] = this.b2[j];
  for (let i = 0; i < N1; i++) { const a = a1[i]; if (a === 0) continue; const r = i * N2; for (let j = 0; j < N2; j++) z2[j] += W2[r + j] * a; }
  for (let j = 0; j < N2; j++) a2[j] = z2[j] > 0 ? z2[j] : 0;
  for (let k = 0; k < N3; k++) z3[k] = this.b3[k];
  for (let i = 0; i < N2; i++) { const a = a2[i]; if (a === 0) continue; const r = i * N3; for (let k = 0; k < N3; k++) z3[k] += W3[r + k] * a; }
  let m = z3[0]; for (let k = 1; k < N3; k++) if (z3[k] > m) m = z3[k];
  let s = 0; for (let k = 0; k < N3; k++) { const e = Math.exp(z3[k] - m); p[k] = e; s += e; }
  const inv = 1 / s; for (let k = 0; k < N3; k++) p[k] *= inv;
  this.lse = m + Math.log(s);   // shifted log-sum-exp: no overflow, and s ≥ 1 so no log(0)
};
// cross-entropy of the last forward pass in the log domain: −ln p_y = logsumexp(z) − z_y (what LogSoftmax + NLLLoss
// compute). Exact even when p_y underflows to 0 in float32, where −ln max(p_y, ε) would silently cap the loss.
Net.prototype.nll = function (y) { return this.lse - this.z3[y]; };
// deltas for the sample last passed through forward(): dL/dz at every layer
Net.prototype.deltas = function (y) {
  const d1 = this.d1, d2 = this.d2, d3 = this.d3, W2 = this.W2, W3 = this.W3;
  for (let k = 0; k < N3; k++) d3[k] = this.p[k] - (k === y ? 1 : 0);
  for (let i = 0; i < N2; i++) {
    if (this.z2[i] > 0) { let s = 0; const r = i * N3; for (let k = 0; k < N3; k++) s += W3[r + k] * d3[k]; d2[i] = s; } else d2[i] = 0;
  }
  for (let i = 0; i < N1; i++) {
    if (this.z1[i] > 0) { let s = 0; const r = i * N2; for (let j = 0; j < N2; j++) s += W2[r + j] * d2[j]; d1[i] = s; } else d1[i] = 0;
  }
};
Net.prototype.accumulate = function (X, off) {
  const d1 = this.d1, d2 = this.d2, d3 = this.d3, a1 = this.a1, a2 = this.a2;
  for (let k = 0; k < N3; k++) this.gb3[k] += d3[k];
  for (let i = 0; i < N2; i++) { const a = a2[i]; if (a === 0) continue; const r = i * N3; for (let k = 0; k < N3; k++) this.gW3[r + k] += a * d3[k]; }
  for (let j = 0; j < N2; j++) this.gb2[j] += d2[j];
  for (let i = 0; i < N1; i++) { const a = a1[i]; if (a === 0) continue; const r = i * N2; for (let j = 0; j < N2; j++) this.gW2[r + j] += a * d2[j]; }
  for (let j = 0; j < N1; j++) this.gb1[j] += d1[j];
  const g = this.gW1;
  for (let i = 0; i < N0; i++) { const x = X[off + i]; if (x === 0) continue; const r = i * N1; for (let j = 0; j < N1; j++) g[r + j] += x * d1[j]; }
};
Net.prototype.zeroGrads = function () {
  this.gW1.fill(0); this.gb1.fill(0); this.gW2.fill(0); this.gb2.fill(0); this.gW3.fill(0); this.gb3.fill(0);
};
function sgd(w, v, g, s) {
  for (let i = 0; i < w.length; i++) { const vi = MOM * v[i] - LR * g[i] * s; v[i] = vi; w[i] += vi; }
}
Net.prototype.trainStep = function () {
  this.ensureBatch(); this.zeroGrads();
  let loss = 0;
  for (let b = 0; b < BATCH; b++) {
    const s = this.perm[this.ptr + b], off = s * N0, y = trainY[s];
    this.forward(trainX, off);
    loss += this.nll(y);
    this.deltas(y); this.accumulate(trainX, off);
  }
  const sc = 1 / BATCH;
  sgd(this.W1, this.vW1, this.gW1, sc); sgd(this.b1, this.vb1, this.gb1, sc);
  sgd(this.W2, this.vW2, this.gW2, sc); sgd(this.b2, this.vb2, this.gb2, sc);
  sgd(this.W3, this.vW3, this.gW3, sc); sgd(this.b3, this.vb3, this.gb3, sc);
  this.ptr += BATCH; this.steps++;

      const pix = SAMPLE_PIX[i], px0 = DIG_X + pix % 28 + 0.5, py0 = DIG_Y + ((pix / 28) | 0) + 0.5, px1 = LX[0] + 2.5 - NR, py1 = NY[i] + 2.5;
      if (st === ST_INPUT || st === ST_FORWARD) {
        const v = sim.vIn[i]; if (v === 0) continue;
        let a, f = 1;
        if (st === ST_INPUT) { if (tt < 12) continue; f = Math.min(1, (tt - 12) / 8); a = 0.9 * v; }
        else a = 0.6 * v * (1 - Math.min(1, tt / 40));
        if (a <= 0.01) continue;
        c.globalAlpha = a; c.strokeStyle = PAL_HEX[v >= 0.6 ? 7 : 6]; c.lineWidth = 0.22;
        c.beginPath(); c.moveTo(px0, py0); c.lineTo(px0 + (px1 - px0) * f, py0 + (py1 - py0) * f); c.stroke();
      } else if (st === ST_BACKWARD && wmax > 0) {
        const I = Math.abs(sim.vd0[i]) / wmax; if (I === 0) continue;
        const dt = tt - sim.nBwdT[i]; if (dt < 0) continue;
        const ia = 0.3 + 0.7 * Math.sqrt(I), tr = 1 + Math.round(I * 2), f = Math.min(1, dt / TW);
        c.setLineDash(sim.vd0[i] < 0 ? DASH : NODASH);
        c.globalAlpha = (dt < TW ? 0.95 : Math.max(0.35, 1 - (dt - TW) / 20)) * ia; c.strokeStyle = PAL_HEX[BR[tr]]; c.lineWidth = 0.24;
        c.beginPath(); c.moveTo(px1, py1); c.lineTo(px1 + (px0 - px1) * f, py1 + (py0 - py1) * f); c.stroke();
        c.setLineDash(NODASH);
        if (dt < TW) { c.globalCompositeOperation = 'lighter'; glow(c, BR[tr + 2 > 5 ? 5 : tr + 2], px1 + (px0 - px1) * f, py1 + (py0 - py1) * f, 1.2 + 1.4 * I, 0.5 + 0.5 * I); c.globalCompositeOperation = 'source-over'; }
      }
    }
    c.globalAlpha = 1;
    // the 16 pixels read by the drawn input neurons
    const hl = st === ST_INPUT && tt >= 10 && tt < 15;
    if (st === ST_BACKWARD && wmax > 0) {
      for (let i = 0; i < 16; i++) {
        const pix = SAMPLE_PIX[i], arrived = tt >= sim.nBwdT[i] + TW;
        c.lineWidth = arrived ? 0.2 : 0.12; c.strokeStyle = PAL_HEX[arrived ? 13 : 5];
        c.globalAlpha = arrived ? 0.35 + 0.65 * Math.abs(sim.vd0[i]) / wmax : 0.6;
        c.strokeRect(DIG_X + pix % 28 + 0.03, DIG_Y + ((pix / 28) | 0) + 0.03, 0.94, 0.94);
      }
    } else {
      const oa = dis >= 0 ? 0.6 * (1 - Math.min(1, dis)) : 0.6 * fade;
      c.lineWidth = hl ? 0.22 : 0.12; c.strokeStyle = PAL_HEX[hl ? 8 : 5]; c.globalAlpha = hl ? 1 : oa;
      c.beginPath();
      for (let i = 0; i < 16; i++) { const pix = SAMPLE_PIX[i]; c.rect(DIG_X + pix % 28 + 0.03, DIG_Y + ((pix / 28) | 0) + 0.03, 0.94, 0.94); }
      c.stroke();
    }
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'lighter';
    if (penX >= 0) { glow(c, 8, penX, penY, 3.2, 0.9); glow(c, 9, penX, penY, 1.1, 1); }       // the pen tip writing the digit
    if (brushX >= 0) {                                                                          // the brush painting ∂L/∂x
      c.globalAlpha = 0.5; c.fillStyle = PAL_HEX[14]; c.fillRect(brushX - 0.15, DIG_Y - 0.5, 0.3, 29);
      c.globalAlpha = 0.12; c.fillRect(brushX - 1.4, DIG_Y - 0.5, 2.8, 29);
    }
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  }

  // ---- prediction: 7-segment LED, segments light one by one; magenta glitch if wrong
  let rev = -1, glitch = false;
  if (st === ST_SOFTMAX) { rev = (tt - 8) / 3; glitch = !sim.vCorrect && tt >= 24 && tt < 26; }
  else if (st === ST_LOSS || st === ST_BACKWARD || st === ST_UPDATE || st === ST_TRAIN || (st === ST_SOLVED && tt >= 120)) rev = 99;
  {
    const d = sim.vPred;
    c.fillStyle = PAL_HEX[2]; c.globalAlpha = 0.55;
    for (let s = 0; s < 7; s++) {
      const o = LEDO[d * 7 + s]; if (rev >= 0 && o !== 255 && rev - o + 1 >= 1) continue;
      ledPath(c, s, 0); c.fill();
    }
    c.globalAlpha = 1;
    const wrongShown = !sim.vCorrect && (st === ST_LOSS || st === ST_BACKWARD || st === ST_UPDATE || st === ST_TRAIN);
    const mg = glitch || wrongShown;
    if (rev >= 0) {
      for (let s = 0; s < 7; s++) {
        const o = LEDO[d * 7 + s]; if (o === 255) continue;
        let a = rev - o + 1; if (a <= 0) continue; if (a > 1) a = 1;
        const gi = (mg ? 7 : 0) + s, g = LEDG[gi];
        c.globalAlpha = a; c.drawImage(g, LED_X + (glitch ? 1.6 : 0) + LEDGX[gi], LED_Y + LEDGY[gi], g.width / K, g.height / K);
      }
      c.lineWidth = 0.34; c.strokeStyle = PAL_HEX[mg ? 14 : 8];
      for (let s = 0; s < 7; s++) {
        const o = LEDO[d * 7 + s]; if (o === 255) continue;
        let a = rev - o + 1; if (a <= 0) continue; if (a > 1) a = 1;
        c.globalAlpha = a; ledBevel(c, s, glitch ? 1.6 : 0); c.stroke();
      }
      c.globalAlpha = 1;
    }
  }

  // ---- legend line whose meaning changes with the phase
  setFont(c, F_LEG, FS_LEG);
  if (st === ST_FORWARD) text(c, 'PULSOS: W·A', 4, 116.5, 7);
  else if (st === ST_LOSS && tt < TL_LOSS) text(c, 'PULSO: P(y)', 4, 116.5, 9);
  else if (st === ST_BACKWARD) text(c, tt < BT0 ? 'PULSOS: ∂L/∂z' : 'PULSOS: ∂L/∂W', 4, 116.5, 13);
  else if (st === ST_UPDATE && tt < 30) text(c, 'DESTELLO: ΔW', 4, 116.5, 8);
  let wStart = 999; for (let i = 0; i < 16; i++) if (sim.nBwdT[i] < wStart) wStart = sim.nBwdT[i];
  if ((st === ST_INPUT && tt >= 12) || (st === ST_FORWARD && tt < 40)) text(c, 'CABLES: x', 4, 121.2, 7);
  else if (st === ST_BACKWARD && tt >= wStart) text(c, 'CABLES: ∂L/∂x', 4, 121.2, 13);
  if (paintOn) {   // scale of the painting: same colors and opacity as the pixels, −max … 0 … +max of this image
    drawF(c, FP_TITLE, 4, 92.6, FSB, TH_RES2);
    for (let i = 0; i < 22; i++) { c.fillStyle = PBAR[i]; c.fillRect(4 + i, 94.3, 1.04, 1.5); }
    setFont(c, F_TINY, FS_TINY); text(c, 'BAJA L', 4, 99.0, 7); text(c, 'SUBE L', 26 - textW(6), 99.0, 13);
  }

  // ---- right column: the prediction, the true label and this digit's loss, worked out as formulas
  fillLV(sim);
  const nx = PRED_X + 0.5, ny0 = PRED_Y + PRED_H + 7.5;
  if (showWin) drawF(c, FR_PRED, nx, ny0, FSR, TH_FWD);             // probability the network gives its own prediction
  if (st === ST_LOSS || st === ST_BACKWARD || st === ST_UPDATE || st === ST_TRAIN || (st === ST_SOLVED && tt >= 120)) {
    const ok = sim.vLabel === sim.vPred;
    const xc = drawF(c, FR_Y, nx, ny0 + 7, FSR, ok ? TH_FWD : TH_BWD) + 2.2;
    setFont(c, F_CHIP, FS_CHIP);
    c.strokeStyle = PAL_HEX[ok ? 6 : 12]; c.lineWidth = 0.22; roundRect(c, xc - 0.9, ny0 + 4.5, textW(ok ? 7 : 5) + 1.8, 3.4, 0.9); c.stroke();
    text(c, ok ? 'ACIERTO' : 'ERROR', xc, ny0 + 7, ok ? 7 : 13);
    if (st !== ST_SOLVED && (st !== ST_LOSS || tt >= TL_LOSS)) {   // L uses the probability of the TRUE class y
      // P(y) with 4 significant digits, so −ln of the shown P(y) reproduces the shown L to its last digit
      const xe = LOSS_TX + widthF(FR_LHEAD, FSR);
      drawF(c, FR_L1, LOSS_TX, LOSS_Y + 10.6, FSR, TH_RES2);
      const w2 = widthF(FR_L2, FSR);
      drawF(c, FR_L2, xe + w2 > 253.6 ? 253.6 - w2 : xe, LOSS_Y + 16.4, FSR, TH_RES2);
      drawF(c, sim.vLoss >= 10 ? FR_L3B : FR_L3, xe, LOSS_Y + 22.2, FSR, TH_RES);
    }
  }

  // ---- particles (additive glow, white → main color → dark)
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < PCAP; i++) {
    const l = sim.plife[i]; if (l <= 0) continue;
    let f = 1 - (l - alpha) / sim.pmax[i]; if (f < 0) f = 0; if (f > 1) f = 1;
    if (sim.pkind[i] === 2) {
      const sx = sim.psx[i] + 0.5, sy = sim.psy[i] + 0.5, tx = sim.ptx[i] + 0.5, ty = sim.pty[i] + 0.5;
      const x = sx + (tx - sx) * f, y = sy + (ty - sy) * f;
      const g = f > 0.18 ? f - 0.18 : 0, x2 = sx + (tx - sx) * g, y2 = sy + (ty - sy) * g;
      c.globalAlpha = 0.7; c.strokeStyle = PAL_HEX[6]; c.lineWidth = 0.35; c.beginPath(); c.moveTo(x2, y2); c.lineTo(x, y); c.stroke();
      glow(c, 7, x, y, 2, 0.9); glow(c, 9, x, y, 0.7, 1);
    } else {
      let ri = (f * 6) | 0; if (ri > 5) ri = 5;
      const ci = sim.pkind[i] === 0 ? FR[5 - ri] : BR[5 - ri];
      glow(c, ci, sim.px[i] + 0.5 + sim.pvx[i] * alpha, sim.py[i] + 0.5 + sim.pvy[i] * alpha, 1.5, 1 - f * 0.6);
    }
  }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;

  // ---- phase indicator: "n/8 NAME  CAPTION" + 8-segment strip (segment width ∝ frame budget)
  setFont(c, F_TOP, FS_TOP);
  const lim = st === ST_SOLVED && sim.solveReason === 2;
  const nm = lim ? 'RESET' : NAMES[st], cap = lim ? CAP_LIMIT : CAPS[st], pre = st === ST_SOLVED ? 0 : 4;
  let tx = (LW - textW(pre + nm.length + 2 + cap.length)) / 2;
  if (pre) tx = text(c, PHASE_NUM[st], tx, 6, 19) + textW(1);
  tx = text(c, nm, tx, 6, PHASE_COL[st]) + textW(2);
  text(c, cap, tx, 6, 18);
  for (let sg = 0; sg < 8; sg++) {
    const x0 = SEG_X[sg] + 0.3, w = SEG_W[sg] - 0.3, y = 8.6;
    if (st === ST_SOLVED) {
      c.globalAlpha = 0.55 + 0.45 * Math.sin(tt * 0.15 + sg); c.strokeStyle = PAL_HEX[sg & 1 ? 7 : 13]; c.lineWidth = 0.6;
      c.beginPath(); c.moveTo(x0, y); c.lineTo(x0 + w, y); c.stroke(); c.globalAlpha = 1; continue;
    }
    if (sg < st) { c.strokeStyle = PAL_HEX[20]; c.lineWidth = 0.6; c.beginPath(); c.moveTo(x0, y); c.lineTo(x0 + w, y); c.stroke(); continue; }
    c.setLineDash(DOTS16); c.strokeStyle = PAL_HEX[sg === st ? 20 : 23]; c.lineWidth = 0.5;
    c.beginPath(); c.moveTo(x0, y); c.lineTo(x0 + w, y); c.stroke(); c.setLineDash(NODASH);
    if (sg === st) {
      const fx = x0 + w * Math.min(1, tt / DUR[st]);
      c.strokeStyle = PAL_HEX[PHASE_COL[st]]; c.lineWidth = 0.7; c.beginPath(); c.moveTo(x0, y); c.lineTo(fx, y); c.stroke();
      c.globalCompositeOperation = 'lighter'; glow(c, PHASE_COL[st], fx, y, 2.2, 0.8);
      c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    }
  }
  // ---- sound icon (top-left), speed / pause (top-right)
  const ic = UI_SOUND === 1 ? 7 : 19;
  c.fillStyle = PAL_HEX[ic]; c.beginPath();
  c.moveTo(2.2, 2.7); c.lineTo(3.5, 2.7); c.lineTo(5.3, 1.1); c.lineTo(5.3, 5.9); c.lineTo(3.5, 4.3); c.lineTo(2.2, 4.3); c.closePath(); c.fill();
  c.strokeStyle = PAL_HEX[ic]; c.lineWidth = 0.4; c.beginPath();
  if (UI_SOUND === 1) {
    c.moveTo(6.15, 2.32); c.arc(5.3, 3.5, 1.45, -0.95, 0.95);
    c.moveTo(6.85, 1.32); c.arc(5.3, 3.5, 2.65, -0.95, 0.95);
  } else { c.moveTo(6.7, 2.4); c.lineTo(8.9, 4.6); c.moveTo(8.9, 2.4); c.lineTo(6.7, 4.6); }
  c.stroke();
  setFont(c, F_LBL, FS_LBL);
  if (UI_SOUND === 0) { c.globalAlpha = 0.55 + 0.45 * Math.sin(UI_BLINK * 0.08); text(c, 'TOCA: SONIDO', 10.5, 5.4, 18); c.globalAlpha = 1; }
  if (UI_PAUSED) { c.globalAlpha = 0.55 + 0.45 * Math.sin(UI_BLINK * 0.12); text(c, 'PAUSA', 254 - textW(5), 5.4, 9); c.globalAlpha = 1; }
  else { const sp = SPD_TXT[UI_SPEED]; text(c, sp, 254 - textW(sp.length), 5.4, UI_SPEED ? 8 : 19); }

  // ---- formula row (what each layer computes) and value row (this digit's numbers), in step with the animation:
  //      a formula lights only once its layer has actually been computed for this digit, its numbers appear with it
  {
    let fam = 0, litA = 0, litB = 0;          // fam: 0 forward, 1 backward, 2 update, 3 model summary, 4 fast training
    switch (st) {
      case ST_IDLE: fam = sim.trainStart >= 0 ? 4 : 3; break;
      case ST_INPUT: if (tt >= 12) { litA = 1; litB = 1; } break;
      case ST_FORWARD:
        litA = 1 | (tt >= sim.ignF[1] ? 2 : 0) | (tt >= sim.ignF[2] ? 4 : 0) | (tt >= sim.ignF[3] ? 8 : 0); litB = litA & 7; break;
      case ST_SOFTMAX: litA = 15; litB = tt >= 10 ? 15 : 7; break;
      case ST_LOSS: litA = 15; litB = 15; break;
      case ST_BACKWARD:
        fam = 1;
        litA = (tt >= sim.ignB[3] ? 8 : 0) | (tt >= sim.ignB[2] ? 4 : 0) | (tt >= sim.ignB[1] ? 2 : 0) | (tt >= sim.ignB[0] ? 1 : 0);
        litB = litA & (tt >= sim.paintT0 ? 15 : 14); break;
      case ST_UPDATE: fam = 2; break;
      case ST_TRAIN: fam = 4; break;
      case ST_SOLVED: fam = 3; break;
    }
    for (let q = 0; q < 4; q++) {
      const on = (litA >> q) & 1, onB = (litB >> q) & 1, cx = SLOT_X[q];
      if (fam === 0) { drawFC(c, FA_FWD[q], cx, ROW_A, FSA, on ? TH_FWD : TH_DIM); if (onB) drawFC(c, FB_FWD[q], cx, ROW_B, FSB, TH_FWD); }
      else if (fam === 1) { drawFC(c, FA_BWD[q], cx, ROW_A, FSA, on ? TH_BWD : TH_DIM); if (onB) drawFC(c, FB_BWD[q], cx, ROW_B, FSB, TH_BWD); }
      else if (fam === 2) { drawFC(c, FA_UPD[q], cx, ROW_A, FSA, TH_UPD); drawFC(c, FB_UPD[q], cx, ROW_B, FSB, TH_UPD); }
      else if (fam === 4) { drawFC(c, FA_UPD[q], cx, ROW_A, FSA, TH_STAT); drawFC(c, q ? FB_SIZE[q] : FB_TRAIN, cx, ROW_B, FSB, q ? TH_STAT : TH_UPD); }
      else { drawFC(c, FA_FWD[q], cx, ROW_A, FSA, TH_STAT); drawFC(c, FB_SIZE[q], cx, ROW_B, FSB, TH_STAT); }
    }
    drawF(c, FC_STATUS, 4, ROW_C, FSC, TH_ROWC);
  }

  // ---- learning card: loss (validation solid, training EMA dotted) and validation accuracy against the 95 % goal.
  //      While training only validation numbers are shown; the test accuracy of the final model (chosen on validation)
  //      appears once, at SOLVED.
  {
    const fin = st === ST_SOLVED && sim.finalTestAcc >= 0, xr = CARD_X + CARD_W - 1.8, n = sim.histN;
    c.strokeStyle = PAL_HEX[23]; c.lineWidth = 0.25; roundRect(c, CARD_X, CARD_Y, CARD_W, CARD_H, 1.4); c.stroke();
    // loss
    setFont(c, F_CARD, FS_CARD); text(c, 'PÉRDIDA', CH_X - 0.2, 109.9, 19);
    setFont(c, F_CARDV, FS_CARDV); c.fillStyle = PAL_HEX[7]; pnum(c, sim.valLoss, 2, xr - numChars(sim.valLoss, 2) * ADV * FS_CARDV, 109.9);
    c.strokeStyle = PAL_HEX[23]; c.lineWidth = 0.18; c.beginPath(); c.moveTo(CH_X, LCH_Y + CH_H); c.lineTo(CH_X + CH_W, LCH_Y + CH_H); c.stroke();
    setFont(c, F_AX, FS_AX); text(c, '2.5', CH_X + CH_W + 0.8, LCH_Y + 0.8, 20); text(c, '0', CH_X + CH_W + 0.8, LCH_Y + CH_H + 0.8, 20);
    chart(c, sim.histTr, n, LMAX, LCH_Y, 18, 0.26, true);
    chart(c, sim.hist, n, LMAX, LCH_Y, 7, 0.36, false);
    // legend: solid = validation, dotted = training (EMA) with its current value
    c.strokeStyle = PAL_HEX[7]; c.lineWidth = 0.36; c.beginPath(); c.moveTo(CH_X, 123.2); c.lineTo(CH_X + 2.2, 123.2); c.stroke();
    setFont(c, F_LEGC, FS_LEGC);
    let lx = text(c, 'VALID.', CH_X + 2.8, 124.0, 7) + 1.2;
    c.strokeStyle = PAL_HEX[18]; c.lineWidth = 0.3; c.setLineDash(DOTS06); c.beginPath(); c.moveTo(lx, 123.2); c.lineTo(lx + 2.0, 123.2); c.stroke(); c.setLineDash(NODASH);
    lx = text(c, 'ENTREN. EMA ', lx + 2.6, 124.0, 18); c.fillStyle = PAL_HEX[18]; pnum(c, net.trainLoss, 2, lx, 124.0);
    // accuracy
    const acc = fin ? sim.finalTestAcc : sim.valAcc;
    setFont(c, F_CARD, FS_CARD); text(c, 'ACIERTO', CH_X - 0.2, 127.7, 19);
    setFont(c, F_CARDV, FS_CARDV);
    const ax = xr - (numChars(acc * 100, 1) + 1) * ADV * FS_CARDV;
    if (sim.evalAge < 30 && !fin) { c.globalCompositeOperation = 'lighter'; glow(c, 6, ax + 5, 126.5, 6, 0.5 * (1 - sim.evalAge / 30)); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; }
    c.fillStyle = PAL_HEX[fin ? 9 : 7]; const ax2 = pnum(c, acc * 100, 1, ax, 127.7); c.fillText('%', ax2, 127.7);
    c.strokeStyle = PAL_HEX[23]; c.lineWidth = 0.18; c.beginPath(); c.moveTo(CH_X, ACH_Y + CH_H); c.lineTo(CH_X + CH_W, ACH_Y + CH_H); c.stroke();
    const yg = ACH_Y + CH_H - 0.95 * CH_H;                             // the goal: validation ≥ 95 % on two cycles
    c.strokeStyle = PAL_HEX[19]; c.lineWidth = 0.18; c.setLineDash(DASH05); c.beginPath(); c.moveTo(CH_X, yg); c.lineTo(CH_X + CH_W, yg); c.stroke(); c.setLineDash(NODASH);
    setFont(c, F_AX, FS_AX); text(c, 'META 95%', CH_X, yg - 0.75, 19);           // above the line, clear of the curve
    text(c, '100', CH_X + CH_W + 0.8, ACH_Y + 0.8, 20); text(c, '0', CH_X + CH_W + 0.8, ACH_Y + CH_H + 0.8, 20);
    chart(c, sim.histAcc, n, 1, ACH_Y, 7, 0.36, false);
    if (n > 0) {
      c.globalCompositeOperation = 'lighter';
      glow(c, 9, CH_X + (n - 1) * CH_W / 31, LCH_Y + CH_H - Math.min(1, sim.hist[n - 1] / LMAX) * CH_H, 1.2, 0.9);
      glow(c, 9, CH_X + (n - 1) * CH_W / 31, ACH_Y + CH_H - Math.min(1, sim.histAcc[n - 1]) * CH_H, 1.2, 0.9);
      if (fin) glow(c, 9, CH_X + CH_W, ACH_Y + CH_H - sim.finalTestAcc * CH_H, 1.8, 1);
      c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    }
    setFont(c, F_TINY, FS_TINY); c.fillStyle = PAL_HEX[18];
    const bx = pnum(c, Math.round(acc * (fin ? NTEST : NVAL)), 0, CH_X - 0.2, 142.5);
    text(c, fin ? ' de 500 · TEST, 1 VEZ' : ' de 500 · VALIDACIÓN', bx, 142.5, 19);
  }
}

// ---------------------------------------------------------------- headless self-test
function selfTest() {
  const T0 = nowMs(); let pass = true;
  const check = function (c, m) { console.assert(c, m); if (!c) { pass = false; console.log('SELFTEST FAIL: ' + m); } };

  // 1) state machine: 8 states in order, back to IDLE, 445 frames per cycle; particle pool bounded
  const sim = new Sim(NET_SEED0); sim.noSolve = true;
  const NC = 3, seq = [], lens = [];
  let prev = -1, cs = 0;
  for (let f = 0; f < CYCLE_FRAMES * NC; f++) {
    if (sim.state !== prev) { if (sim.state === ST_IDLE && prev !== -1) { lens.push(f - cs); cs = f; } seq.push(sim.state); prev = sim.state; }
    sim.step();
    check(sim.alive <= PCAP, 'particle pool within capacity');
  }
  lens.push(CYCLE_FRAMES * NC - cs);
  let orderOk = seq.length === 8 * NC; for (let i = 0; i < seq.length; i++) if (seq[i] !== i % 8) orderOk = false;
  check(orderOk, 'states visited in order IDLE..TRAIN each cycle');
  check(sim.state === ST_IDLE && sim.t === 0, 'cycle returns to IDLE');
  check(lens.length === NC && lens.every(function (l) { return l === CYCLE_FRAMES; }), 'each cycle lasts ' + CYCLE_FRAMES + ' frames: ' + lens.join(','));
  const loopMax = sim.maxAlive;
  for (let i = 0; i < PCAP * 3; i++) sim.spawn(10, 10, 0, 0, 30, 0, 0);
  check(sim.alive <= PCAP && sim.maxAlive <= PCAP, 'particle pool never exceeds capacity (max ' + sim.maxAlive + '/' + PCAP + ')');

  // 2) softmax sums to 1
  const net = new Net(); net.reset(NET_SEED0);
  let worst = 0;
  for (let s = 0; s < 200; s++) { net.forward(testX, s * N0); let sum = 0; for (let k = 0; k < 10; k++) sum += net.p[k]; worst = Math.max(worst, Math.abs(sum - 1)); }
  check(worst <= 1e-5, 'softmax sums to 1 (max err ' + worst.toExponential(2) + ')');

  // 2b) cross-entropy in the log domain (log-sum-exp, like PyTorch's LogSoftmax + NLLLoss): equals −ln p_y in the

      sxy += (giv[i] - mx) * (igv[i] - my); sxx += (giv[i] - mx) * (giv[i] - mx); syy += (igv[i] - my) * (igv[i] - my);
      tot += Math.abs(igv[i]); if ((igv[i] > 0) === (giv[i] > 0)) ag += Math.abs(igv[i]);
    }
    igR.push(sxy / Math.sqrt(sxx * syy)); igS.push(ag / tot); igF.push(sGI / dL);
  }
  const med = function (a) { const b = a.slice().sort(function (p, r) { return p - r; }); return b[b.length >> 1]; };
  check(igWorst < 0.01, 'Integrated Gradients completeness: Σ IG = L(x) − L(black) within 1% on 20 digits (worst ' + (igWorst * 100).toFixed(2) + '%)');
  check(med(igR) > 0.8 && med(igS) > 0.9, 'painted x·∂L/∂x agrees with Integrated Gradients (median r = ' + med(igR).toFixed(2) +
    ', |IG|-weighted sign agreement ' + (med(igS) * 100).toFixed(0) + '%)');

  // Wilson 95% interval for the test accuracy, per-class accuracy
  const z = 1.96, ph = ln.lastAcc, nn = NTEST, den = 1 + z * z / nn;
  const ctr = (ph + z * z / (2 * nn)) / den, hw = z * Math.sqrt(ph * (1 - ph) / nn + z * z / (4 * nn * nn)) / den;
  let perClass = '';
  for (let y = 0; y < 10; y++) { let tot = 0; for (let q = 0; q < 10; q++) tot += conf[y * 10 + q]; perClass += y + ':' + Math.round(100 * conf[y * 11] / tot) + '% '; }

  console.log('[selfTest] ' + (pass ? 'PASS' : 'FAIL') + ' in ' + Math.round(nowMs() - T0) + ' ms');
  const perCycle = 1 + TRAIN_STEPS_PER_FRAME * DUR[ST_TRAIN];
  console.log('[selfTest] steps to 93%: ' + stepsTo + ' (~' + (stepsTo / perCycle).toFixed(1) + ' cycles, ~' +
    Math.round(stepsTo / perCycle * CYCLE_FRAMES / 60) + ' s of animation), test accuracy ' + (ln.lastAcc * 100).toFixed(1) + '%');
  console.log('[selfTest] holdout: SOLVED on validation ' + (valAtSolve * 100).toFixed(1) + '% at step ' + sv.net.steps + ' (~' +
    Math.round(svFrames / 60) + ' s), then the test set once: ' + (testAtSolve * 100).toFixed(1) + '% (test reads before SOLVED: ' + testReads + ')');
  console.log('[selfTest] attribution: Integrated Gradients completeness worst ' + (igWorst * 100).toFixed(2) + '%; painted x·∂L/∂x vs IG: median r ' +
    med(igR).toFixed(2) + ', sign agreement ' + (med(igS) * 100).toFixed(0) + '%, Σ x·∂L/∂x = ' + (med(igF) * 100).toFixed(0) + '% of L(x) − L(black) (first-order only)');
  console.log('[selfTest] gradient check: ' + gcount + ' params, worst rel err ' + gworst.toExponential(2) +
    '; particles: peak ' + loopMax + ' during 3 cycles, ' + sim.alive + '/' + PCAP + ' under a 3x over-spawn stress');
  console.log('[selfTest] test accuracy 95% CI (Wilson, n=500): ' + ((ctr - hw) * 100).toFixed(1) + '% – ' + ((ctr + hw) * 100).toFixed(1) + '%');
  console.log('[selfTest] per-class accuracy: ' + perClass);
  console.log('[selfTest] sync: ' + NE + ' edges × 6 cycles, 0 violations allowed → ' + syncBad + '; SGD mismatches ' + sgdBad + '; test/train duplicates ' + dup);
  console.log('[selfTest] display audit: ' + nCyc + ' cycles re-derived independently (incl. ∂L/∂x and the painted x·∂L/∂x for all 784 pixels), mesh checked on ' + meshChecks + ' frames, ' + nEval + ' validation evaluations re-run → ' + (dispBad + lvlBad + gradBad + meshBad + hudBad + epochBad) + ' mismatches');
  console.log('[selfTest] on-screen text audit: ' + txtFrames + ' rendered frames re-read, ' + rowChecks + ' formula slots checked lit/dim (' + txtWrong + ' with a wrong prediction) → ' + txtBad + ' mismatches; 7-segment table ' + (ledBad ? 'WRONG' : 'ok'));
  console.log('[selfTest] drawn input pixels (row,col): ' + Array.from(SAMPLE_PIX).map(function (q) { return '(' + ((q / 28) | 0) + ',' + (q % 28) + ')'; }).join(' '));
  console.log('[selfTest] confusion matrix (500 test digits):\n' + rows);
  return { pass: pass, stepsTo93: stepsTo, testAcc: ln.lastAcc, ci95: [ctr - hw, ctr + hw], gradWorst: gworst, syncViolations: syncBad, confusion: conf,
    valAtSolve: valAtSolve, stepsAtSolve: sv.net.steps, finalTestAcc: testAtSolve, igMedianR: med(igR), igSignAgree: med(igS), igCompletenessWorst: igWorst };
}

// ---------------------------------------------------------------- procedural audio (WebAudio, no assets)
// A fixed pool of always-running voices; notes are envelopes on their gains, so playing allocates no nodes.
// Every sound is driven by a simulation event and scaled by the real quantity behind it.
const SND = { ctx: null, on: false, master: null, sq: [], sqg: [], tr: [], trg: [], si: 0, ti: 0,
  nf: null, ng: null, sub: null, subg: null, dr: null, drg: null, read: 0, tick: 0 };
const PENT = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22];
const IGN_F = [220, 330, 440, 660], IGN_B = [110, 147, 196, 262];
const PHASE_HZ = [262, 294, 330, 392, 440, 494, 523, 587, 659];
function semis(base, k) { return base * Math.pow(2, PENT[k % 10] / 12); }
function layerOf(n) { return n < 16 ? 0 : n < 32 ? 1 : n < 48 ? 2 : 3; }
function sndInit(sim) {

  const c = SND.ctx = new AC();
  const comp = c.createDynamicsCompressor(); comp.connect(c.destination);
  const m = SND.master = c.createGain(); m.gain.value = 0; m.connect(comp);
  const voice = function (type, oscArr, gainArr) {
    const o = c.createOscillator(), g = c.createGain(); o.type = type; g.gain.value = 0;
    o.connect(g); g.connect(m); o.start(); oscArr.push(o); gainArr.push(g);
  };
  for (let i = 0; i < 8; i++) voice('square', SND.sq, SND.sqg);
  for (let i = 0; i < 8; i++) voice('triangle', SND.tr, SND.trg);
  const sub = [], subg = [], dr = [], drg = [];
  voice('sine', sub, subg); voice('triangle', dr, drg);
  SND.sub = sub[0]; SND.subg = subg[0]; SND.dr = dr[0]; SND.drg = drg[0];
  const buf = c.createBuffer(1, c.sampleRate, c.sampleRate), d = buf.getChannelData(0), r = new Rng(99);
  for (let i = 0; i < d.length; i++) d[i] = r.next() * 2 - 1;
  const ns = c.createBufferSource(); ns.buffer = buf; ns.loop = true;
  SND.nf = c.createBiquadFilter(); SND.nf.type = 'bandpass';
  SND.ng = c.createGain(); SND.ng.gain.value = 0;
  ns.connect(SND.nf); SND.nf.connect(SND.ng); SND.ng.connect(m); ns.start();
  SND.read = sim.evHead;
}
function env(g, t, vol, dur) {
  const p = g.gain; p.cancelScheduledValues(t); p.setValueAtTime(0.0001, t);
  p.linearRampToValueAtTime(vol, t + 0.005); p.exponentialRampToValueAtTime(0.0001, t + dur);
}
function sq(f, vol, dur, delay, f2) {
  const t = SND.ctx.currentTime + delay, i = SND.si; SND.si = (i + 1) % SND.sq.length;
  const fr = SND.sq[i].frequency; fr.cancelScheduledValues(t); fr.setValueAtTime(f, t);
  if (f2 > 0) fr.exponentialRampToValueAtTime(f2, t + dur);
  env(SND.sqg[i], t, vol, dur);
}
function tri(f, vol, dur, delay) {
  const t = SND.ctx.currentTime + delay, i = SND.ti; SND.ti = (i + 1) % SND.tr.length;
  const fr = SND.tr[i].frequency; fr.cancelScheduledValues(t); fr.setValueAtTime(f, t);
  env(SND.trg[i], t, vol, dur);
}
function nz(fc, q, vol, dur, fc2) {
  const t = SND.ctx.currentTime, fr = SND.nf.frequency;
  fr.cancelScheduledValues(t); fr.setValueAtTime(fc, t); if (fc2 > 0) fr.exponentialRampToValueAtTime(fc2, t + dur);
  SND.nf.Q.setValueAtTime(q, t); env(SND.ng, t, vol, dur);
}
function thump(f, f2, vol, dur) {
  const t = SND.ctx.currentTime, fr = SND.sub.frequency;
  fr.cancelScheduledValues(t); fr.setValueAtTime(f, t); fr.exponentialRampToValueAtTime(f2, t + dur);
  env(SND.subg, t, vol, dur);
}
function sndUpdate(sim, paused) {
  if (!SND.ctx) return;
  if (sim.evHead - SND.read > 256) SND.read = sim.evHead - 256;
  let budget = 3;                                   // at most 3 neuron blips per frame
  for (; SND.read < sim.evHead; SND.read++) {
    if (!SND.on) continue;
    const i = SND.read & 255, a = sim.evA[i], v = sim.evV[i];
    switch (sim.evT[i]) {
      case EV_STATE:                                // a soft marker note per phase (rising through the cycle)
        tri(PHASE_HZ[a], 0.035, 0.1, 0);
        if (a === ST_SOLVED) for (let j = 0; j < 6; j++) tri(semis(523, j), 0.08, 0.2, j * 0.07);
        break;
      case EV_WRITE: nz(2200 + v * 900, 2.5, 0.05, 0.04, 1500); break;              // pen scratch
      case EV_LAUNCH: nz(600, 1.4, 0.07, 0.16, 5200); break;                       // pixels fly
      case EV_ARRIVE: if (a > 0) tri(semis(220, a), 0.06, 0.14, 0); break;         // pitch = lit input neurons
      case EV_IGNF:                                                                 // pitch = layer + neuron, loudness = level
        if (budget > 0) { budget--; const L = layerOf(a); sq(semis(IGN_F[L], a - LOFF[L]), 0.018 + 0.016 * v, 0.07, 0, 0); }
        break;
      case EV_IGNB:
        if (budget > 0) { budget--; const L = layerOf(a), f = semis(IGN_B[L], a - LOFF[L]); sq(f, 0.022 + 0.016 * v, 0.11, 0, f * 0.7); }
        break;
      case EV_PRED: {                                // major arpeggio if right, minor-second clash if wrong

        if (v > 0.5) { tri(r, 0.12, 0.25, 0); tri(r * 1.2599, 0.1, 0.25, 0.06); tri(r * 1.4983, 0.1, 0.35, 0.12); }

      case EV_GLITCH: nz(4200, 0.7, 0.12, 0.06, 1400); sq(90, 0.05, 0.06, 0, 60); break;
      case EV_LOSS: {                                // loudness and brightness ∝ cross-entropy of this sample

      case EV_UPDATE: {                              // shimmer ∝ ||Δθ|| relative to its recent average
        const k = Math.min(1.5, v) / 1.5;
        for (let j = 0; j < 4; j++) tri(semis(1047, j + 2), 0.025 + 0.05 * k, 0.12, j * 0.03);
        nz(7000, 1, 0.015 + 0.04 * k, 0.2, 9000);
        break;
      }
      case EV_TICK:                                  // fast-forward ticks; pitch rises as training loss falls
        if ((SND.tick++ % 3) === 0) sq(180 + (1 - Math.min(v, 2.3) / 2.3) * 520, 0.016, 0.025, 0, 0);
        break;
      case EV_EVAL: tri(300 + v * 900, 0.06, 0.13, 0); break;                     // pitch ∝ validation accuracy
      case EV_SCAN: tri(110 * Math.pow(2, (a - 50) / 71), 0.045, 0.07, 0); break;
      case EV_PARADE: tri(semis(392, a), 0.08, 0.16, 0); break;
      case EV_RESET: thump(90, 35, 0.22, 0.6); break;
      case EV_WIRE: sq(semis(110, a), 0.02 + 0.012 * v, 0.06, 0, 0); break;                     // ∂L/∂x_i reaches its pixel
      case EV_PAINT: nz(900 + 2600 * (1 - v), 1.3, 0.04 + 0.01 * a, 0.09, 500); break;          // brush stroke
    }

  const now = SND.ctx.currentTime, xf = SND.on && !paused ? sim.frontX() : -1000;
  if (xf > -1000) { SND.dr.frequency.setTargetAtTime(110 * Math.pow(2, (xf - 54) / 132), now, 0.03); SND.drg.gain.setTargetAtTime(0.05, now, 0.05); }
  else SND.drg.gain.setTargetAtTime(0, now, 0.06);
}

// ---------------------------------------------------------------- boot (browser only)
// Controls: tap/click once = sound on. Then: tap = pause, speaker (top-left) = mute, speed (top-right) = 1×/½×/¼×.
// Keys: Space pause · M mute · S speed · → advance 5 frames while paused · F fullscreen · P save a 3840×2160 PNG.
function boot() {
  const cv = document.getElementById('screen');
  const ctx = cv.getContext('2d', { alpha: false });
  MAKE_CANVAS = function (w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const sim = new Sim(NET_SEED0); sim.budgetMs = 5;
  window.sim = sim;
  let accT = 0, last = -1, lastDpr = 0;
  function resize() {
    let dpr = window.devicePixelRatio || 1;
    const cap = Math.sqrt((7680 * 4320) / Math.max(1, window.innerWidth * window.innerHeight * dpr * dpr));
    lastDpr = window.devicePixelRatio || 1; if (cap < 1) dpr *= cap;            // never above 8K worth of pixels
    const w = Math.round(window.innerWidth * dpr), h = Math.round(window.innerHeight * dpr);
    cv.width = w; cv.height = h; cv.style.width = window.innerWidth + 'px'; cv.style.height = window.innerHeight + 'px';
    setViewport(w, h);
  }
  function soundOn(v) {
    sndInit(sim); if (!SND.ctx) { UI_SOUND = 2; return; }        // no WebAudio: stay silent, taps keep working
    if (SND.ctx.state === 'suspended') SND.ctx.resume();
    SND.on = v; UI_SOUND = v ? 1 : 2;
    SND.master.gain.setTargetAtTime(v ? 0.5 : 0, SND.ctx.currentTime, 0.02);
  }
  function shot4k() {   // render the current frame at 3840×2160 regardless of the window size
    const w0 = VW, h0 = VH, c4 = MAKE_CANVAS(3840, 2160);
    setViewport(3840, 2160); render(c4.getContext('2d', { alpha: false }), sim, 0); setViewport(w0, h0);
    c4.toBlob(function (b) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'red-neuronal-4k.png';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    }, 'image/png');
  }
  window.shot4k = shot4k;
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (UI_SOUND === 0) { soundOn(true); return; }
    const r = cv.getBoundingClientRect(), k = cv.width / r.width;
    const lx = ((e.clientX - r.left) * k - OX) / K, ly = ((e.clientY - r.top) * k - OY) / K;
    if (ly < 10 && lx < 40) soundOn(UI_SOUND !== 1);
    else if (ly < 10 && lx > 216) UI_SPEED = (UI_SPEED + 1) % SPEEDS.length;
    else UI_PAUSED = !UI_PAUSED;
  });
  window.addEventListener('keydown', function (e) {
    if (UI_SOUND === 0) { soundOn(true); if (e.code === 'KeyM') return; }
    if (e.code === 'Space') { UI_PAUSED = !UI_PAUSED; e.preventDefault(); }
    else if (e.code === 'KeyM') soundOn(UI_SOUND !== 1);
    else if (e.code === 'KeyS') UI_SPEED = (UI_SPEED + 1) % SPEEDS.length;
    else if (e.code === 'ArrowRight' && UI_PAUSED) { for (let i = 0; i < 5; i++) sim.step(); }
    else if (e.code === 'KeyP') shot4k();
    else if (e.code === 'KeyF') {
      if (!document.fullscreenElement) { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }
      else if (document.exitFullscreen) document.exitFullscreen();
    }
  });
  document.addEventListener('visibilitychange', function () {   // hidden tab: no frames → stop the drone too
    if (!SND.ctx) return;
    if (document.hidden) SND.ctx.suspend(); else if (SND.on) SND.ctx.resume();
  });
  window.addEventListener('resize', resize); resize();
  function frame(now) {
    if (last < 0) last = now;
    let el = now - last; last = now; if (el > 250) el = 250;
    UI_BLINK++;
    if ((window.devicePixelRatio || 1) !== lastDpr) resize();    // moved to another monitor or zoomed
    if (!UI_PAUSED) {
      accT += el * SPEEDS[UI_SPEED];
      let n = 0; while (accT >= DT && n < 8) { sim.step(); accT -= DT; n++; }
      if (n === 8) accT = 0;
    }
    sndUpdate(sim, UI_PAUSED);
    render(ctx, sim, UI_PAUSED ? 0 : accT / DT);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
if (typeof window !== 'undefined') window.selfTest = selfTest;
if (typeof document !== 'undefined' && document.getElementById) {
  if (/[?&]test\b/.test(location.search)) selfTest();
  boot();
}
